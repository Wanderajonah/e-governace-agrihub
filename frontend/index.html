
  <!DOCTYPE html>
  <html lang="en">
    <head>
      
      <meta charset="UTF-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0" />
      <title>AgriHub — Uganda Agricultural Market Governance Platform</title>
      <meta name="description" content="AgriHub digitizes Uganda's agricultural markets — from produce arrival to sale — so farmers, traders, authorities, and government can rely on real-time market data." />
      <style>
        html, body { height: 100%; margin: 0; } #root { height: 100%; }
        #splash {
          position: fixed; inset: 0; z-index: 99999;
          display: flex; flex-direction: column; align-items: center; justify-content: center;
          background: #0a0a14;
          transition: opacity 0.6s ease, visibility 0.6s ease;
        }
        #splash.hidden { opacity: 0; visibility: hidden; pointer-events: none; }
        #splash-logo {
          width: 72px; height: 72px;
          background: rgba(46,204,113,0.15);
          border-radius: 18px;
          display: flex; align-items: center; justify-content: center;
          margin-bottom: 20px;
          animation: splashPop 0.5s ease-out;
        }
        #splash-logo svg { width: 36px; height: 36px; fill: none; stroke: #2ecc71; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
        #splash h1 {
          margin: 0; font-family: system-ui, -apple-system, sans-serif;
          font-size: 28px; font-weight: 800; color: #fff; letter-spacing: -0.5px;
          animation: splashPop 0.5s ease-out 0.1s both;
        }
        #splash p {
          margin: 6px 0 0; font-family: system-ui, -apple-system, sans-serif;
          font-size: 13px; color: rgba(255,255,255,0.5); letter-spacing: 0.3px;
          animation: splashPop 0.5s ease-out 0.2s both;
        }
        #splash-spinner {
          margin-top: 32px;
          width: 32px; height: 32px;
          border: 3px solid rgba(255,255,255,0.08);
          border-top-color: #2ecc71;
          border-radius: 50%;
          animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        @keyframes splashPop {
          0% { opacity: 0; transform: scale(0.85) translateY(8px); }
          100% { opacity: 1; transform: scale(1) translateY(0); }
        }
      </style>
      
    </head>

    <body>
      
      <div id="splash">
        <div id="splash-logo">
          <svg viewBox="0 0 24 24"><path d="M11 20A7 7 0 0 1 9.8 6.9C15.5 4.9 17 3.5 19 2c1 2 2 4.5 2 8 0 5.5-4.78 10-10 10Z"/><path d="M2 21c0-3 1.85-5.36 5.08-6C9.5 14.52 12 13 13 12"/></svg>
        </div>
        <h1>AgriHub</h1>
        <p>Agricultural Market Governance Platform</p>
        <div id="splash-spinner"></div>
      </div>
      
      <div id="root"></div>
      <script type="module" src="/src/main.tsx"></script>
      
    </body>
  </html>
